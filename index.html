<!DOCTYPE html>
<html>
<head>
    <title>Text Generator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 50px auto;
            padding: 20px;
            background: #f5f5f5;
        }
        h1 { color: #2c3e50; }
        select, button {
            padding: 10px;
            font-size: 16px;
            margin: 10px 5px 10px 0;
        }
        button {
            background: #2c3e50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover { background: #34495e; }
        #output {
            background: white;
            border: 1px solid #ccc;
            padding: 15px;
            margin-top: 20px;
            white-space: pre-wrap;
            min-height: 150px;
            border-radius: 5px;
        }
        #loading {
            display: none;
            color: #888;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <h1>My Trained Text Generator</h1>
    <p>Choose a model and generate new text based on what it learned.</p>

    <label>Dataset:</label>
    <select id="dataset">
        <option value="twitter">Twitter (my cleaned dataset)</option>
        <option value="shakespeare">Shakespeare</option>
    </select>

    <button onclick="generateText()">Generate</button>
    <div id="loading">Generating... (this can take 10-20 seconds)</div>

    <div id="output"></div>

    <script>
        async function generateText() {
            const dataset = document.getElementById('dataset').value;
            const loading = document.getElementById('loading');
            const output = document.getElementById('output');

            loading.style.display = 'block';
            output.textContent = '';

            const response = await fetch('/generate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ dataset: dataset })
            });

            const data = await response.json();
            loading.style.display = 'none';
            output.textContent = data.output;
        }
    </script>
</body>
</html>
